<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: diagonal peach gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE4D0"/>
      <stop offset="100%" stop-color="#FFAC8C"/>
    </linearGradient>
    <!-- Spine: horizontal coral gradient -->
    <linearGradient id="spineGrad" x1="106" y1="0" x2="178" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF9494"/>
    </linearGradient>
    <!-- Page: vertical cream gradient -->
    <linearGradient id="pageGrad" x1="0" y1="126" x2="0" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFBF9"/>
      <stop offset="100%" stop-color="#FFEAE4"/>
    </linearGradient>
    <!-- Soft drop shadow for the notebook -->
    <filter id="nbShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="7" stdDeviation="9" flood-color="#B05040" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle depth glows -->
  <circle cx="442" cy="70"  r="70" fill="white" opacity="0.10"/>
  <circle cx="68"  cy="448" r="90" fill="white" opacity="0.07"/>

  <!-- ── NOTEBOOK ── -->
  <g filter="url(#nbShadow)">
    <!-- Spine: rounded left corners, straight right edge (CCW path → sweep=0) -->
    <path d="M 118 126
             A 12 12 0 0 0 106 138
             L 106 374
             A 12 12 0 0 0 118 386
             L 178 386 L 178 126 Z"
          fill="url(#spineGrad)"/>
    <!-- Pages: straight left edge, rounded right corners (CW path → sweep=1) -->
    <path d="M 178 126 L 394 126
             A 12 12 0 0 1 406 138
             L 406 374
             A 12 12 0 0 1 394 386
             L 178 386 Z"
          fill="url(#pageGrad)"/>
  </g>

  <!-- ── SPINE RINGS ── -->
  <g fill="white" stroke="#FF5050" stroke-width="3.5">
    <circle cx="178" cy="162" r="10"/>
    <circle cx="178" cy="210" r="10"/>
    <circle cx="178" cy="258" r="10"/>
    <circle cx="178" cy="306" r="10"/>
    <circle cx="178" cy="354" r="10"/>
  </g>

  <!-- ── PAGE CONTENT ── -->
  <!-- Title bar -->
  <rect x="200" y="142" width="176" height="14" rx="7" fill="#FFCCC0"/>

  <!-- Ruled lines -->
  <g stroke="#FFDDD8" stroke-width="1.5">
    <line x1="200" y1="173" x2="394" y2="173"/>
    <line x1="200" y1="219" x2="394" y2="219"/>
    <line x1="200" y1="265" x2="394" y2="265"/>
    <line x1="200" y1="311" x2="394" y2="311"/>
  </g>

  <!-- Row 1: CHECKED -->
  <rect x="200" y="170" width="22" height="22" rx="5"
        fill="#FFD4C8" stroke="#FF8070" stroke-width="2.5"/>
  <polyline points="204,181 209,187 221,174"
            fill="none" stroke="#E03030" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="233" y="175" width="122" height="12" rx="6" fill="#FFCCC4"/>

  <!-- Row 2: CHECKED -->
  <rect x="200" y="216" width="22" height="22" rx="5"
        fill="#FFD4C8" stroke="#FF8070" stroke-width="2.5"/>
  <polyline points="204,227 209,233 221,220"
            fill="none" stroke="#E03030" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="233" y="221" width="95" height="12" rx="6" fill="#FFCCC4"/>

  <!-- Row 3: PENDING -->
  <rect x="200" y="262" width="22" height="22" rx="5"
        fill="none" stroke="#FFBCB4" stroke-width="2.5"/>
  <rect x="233" y="267" width="145" height="12" rx="6" fill="#FFECEA"/>

  <!-- Row 4: PENDING -->
  <rect x="200" y="308" width="22" height="22" rx="5"
        fill="none" stroke="#FFBCB4" stroke-width="2.5"/>
  <rect x="233" y="313" width="108" height="12" rx="6" fill="#FFECEA"/>

  <!-- ── DECORATIONS ── -->
  <!-- 4-pointed sparkle star, golden, top-right (outer r=28, inner r≈11) -->
  <path d="M 400 70 L 408 90 L 428 98 L 408 106
           L 400 126 L 392 106 L 372 98 L 392 90 Z"
        fill="#FFD54F"/>
  <!-- Star centre highlight -->
  <circle cx="400" cy="98" r="9" fill="#FFF9C4" opacity="0.65"/>

  <!-- Left sparkle -->
  <path d="M 115 198 L 118 189 L 121 198 L 130 201
           L 121 204 L 118 213 L 115 204 L 106 201 Z"
        fill="#FF9090" opacity="0.80"/>

  <!-- Bottom-right sparkle -->
  <path d="M 416 328 L 419 320 L 422 328 L 430 331
           L 422 334 L 419 342 L 416 334 L 408 331 Z"
        fill="#FFB09A" opacity="0.70"/>

  <!-- Floating dots -->
  <circle cx="436" cy="212" r="6" fill="#FFD4BC" opacity="0.60"/>
  <circle cx="447" cy="228" r="4" fill="#FFD4BC" opacity="0.40"/>
  <circle cx="80"  cy="312" r="5" fill="#FF9090" opacity="0.50"/>
  <circle cx="68"  cy="298" r="3" fill="#FF9090" opacity="0.35"/>
</svg>
